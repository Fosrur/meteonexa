name: MeteoNexa QA
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'
permissions:
  contents: read
concurrency:
  group: meteonexa-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-curl php-gd
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify deterministic dependency manifests
        run: |
          test -f package-lock.json
          test -f qa/package-lock.json
          test -f composer.lock
      - name: Verify committed release provenance
        run: python3 qa/release_provenance_smoke.py . --require-git --require-clean
      - name: Verify committed release checksums
        run: npm run checksums:verify
      - name: Rebuild deterministic production assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:production
      - name: Current release and regression suite
        run: bash qa/run-all.sh

  mysql-auth-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: meteonexa
          MYSQL_USER: meteonexa
          MYSQL_PASSWORD: meteonexa
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql default-mysql-client
      - name: Real MySQL integration
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: meteonexa
          MYSQL_USER: meteonexa
          MYSQL_PASSWORD: meteonexa
        run: |
          mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -prootpass -e "SET GLOBAL log_bin_trust_function_creators = 1"
          php qa/mysql_auth_integration.php
          php qa/mysql_full_integration.php

  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PHP and Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mbstring php-xml php-curl composer
      - name: Install quality dependencies
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-audit --no-fund
      - name: PHPStan
        run: |
          composer analyse
          vendor/bin/phpstan analyse -c config/quality/phpstan-p6.neon --no-progress --memory-limit=1G
      - name: ESLint, esbuild graph and production frontend build
        run: |
          npm run lint:eslint
          npm run bundle:verify
          npm run build:production
          npm run check:p4:build
          npm run check:p4:i18n
      - name: Semgrep local security rules
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.169.0 semgrep scan --config /src/config/quality/semgrep.yml --error --metrics=off /src/api /src/install /src/modules/esm
      - name: Build hardened production image
        run: docker build -t meteonexa:ci .
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy production image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: meteonexa:ci
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          exit-code: '1'

  backup-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated production-like MySQL/runtime
        run: |
          cat > .env <<'EOF_ENV'
          MYSQL_DATABASE=meteonexa
          MYSQL_USER=meteonexa
          MYSQL_PASSWORD=ci_app_password_8fH2m7L5
          MYSQL_ROOT_PASSWORD=ci_root_password_9qK4n8R6
          METEONEXA_BASE_URL=https://staging.invalid/
          METEONEXA_RUNTIME_DIR=./runtime
          EOF_ENV
          mkdir -p runtime
          printf '%s' 'ci-app-secret-not-for-production-0123456789abcdef0123456789abcdef' > runtime/.app-secret
          sudo chown -R 33:33 runtime
          docker network inspect proxy >/dev/null 2>&1 || docker network create proxy
          docker compose up -d db
          for i in $(seq 1 40); do
            if docker compose exec -T db sh -lc 'export MYSQL_PWD="$MYSQL_PASSWORD"; mysqladmin ping -h127.0.0.1 -u"$MYSQL_USER" --silent' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose exec -T db sh -lc 'export MYSQL_PWD="$MYSQL_PASSWORD"; mysqladmin ping -h127.0.0.1 -u"$MYSQL_USER" --silent'
      - name: Seed current schema 28
        run: |
          cat api/install/mysql-schema.sql | docker compose exec -T db sh -lc 'export MYSQL_PWD="$MYSQL_PASSWORD"; exec mysql -u"$MYSQL_USER" "$MYSQL_DATABASE"'
          cat api/install/mysql-triggers.sql | docker compose exec -T db sh -lc 'export MYSQL_PWD="$MYSQL_PASSWORD"; exec mysql -u"$MYSQL_USER" "$MYSQL_DATABASE"'
      - name: Create official backup and execute real restore drill
        run: |
          bash ./docker/backup-production.sh "$RUNNER_TEMP/meteonexa-backup"
          bash ./docker/verify-backup-restore.sh "$RUNNER_TEMP/meteonexa-backup"
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true

  staging-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare staging environment from production compose
        run: |
          cp .env.staging.example .env.staging
          sed -i 's/CHANGE_ME_APP_DB_PASSWORD/ci_staging_app_6Gk4x9P2/' .env.staging
          sed -i 's/CHANGE_ME_ROOT_DB_PASSWORD/ci_staging_root_7Hm5y0Q3/' .env.staging
          docker network inspect proxy >/dev/null 2>&1 || docker network create proxy
          sudo -n true
          bash ./docker/staging-up.sh .env.staging
      - name: Verify hardened staging containers
        run: |
          docker compose --env-file .env.staging ps
          test "$(docker inspect -f '{{.Config.User}}' meteonexa-staging-web)" = '33:33'
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' meteonexa-staging-web)" = 'true'
          test "$(docker inspect -f '{{.Config.User}}' meteonexa-staging-worker)" = '33:33'
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' meteonexa-staging-worker)" = 'true'
          docker exec meteonexa-staging-web curl -fsS http://127.0.0.1/ >/dev/null
      - name: Verify maintenance mode surface and assets
        run: |
          docker exec meteonexa-staging-web sh -c ': > /var/lib/meteonexa/maintenance.flag'
          CODE="$(docker exec meteonexa-staging-web curl -sS -o /tmp/maintenance.html -w '%{http_code}' -H 'Accept: text/html' http://127.0.0.1/)"
          test "$CODE" = '503'
          docker exec meteonexa-staging-web grep -q 'maintenance-card' /tmp/maintenance.html
          for path in /css/maintenance.css /js/maintenance.js /assets/logo-full.png /assets/icons/favicon-32.png /assets/i18n/it.json; do
            test "$(docker exec meteonexa-staging-web curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1$path")" = '200'
          done
          docker exec meteonexa-staging-web rm -f /var/lib/meteonexa/maintenance.flag /tmp/maintenance.html
      - name: Cleanup
        if: always()
        run: |
          COMPOSE_PROJECT_NAME=meteonexa-staging METEONEXA_DB_CONTAINER_NAME=meteonexa-staging-db METEONEXA_WEB_CONTAINER_NAME=meteonexa-staging-web METEONEXA_WORKER_CONTAINER_NAME=meteonexa-staging-worker METEONEXA_RUNTIME_DIR=./runtime-staging docker compose --env-file .env.staging down -v --remove-orphans || true
          sudo rm -rf runtime-staging .env.staging || true

  browser-regression:
    name: browser-regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release-gates, mysql-auth-regression, quality-security, backup-restore-drill, staging-compose]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 php-curl php-gd
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build production frontend for browser regression
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:production
      - name: Start isolated application
        run: |
          mkdir -p "$RUNNER_TEMP/meteonexa/runtime"
          METEONEXA_STORAGE_PATH="$RUNNER_TEMP/meteonexa/runtime" php -S 127.0.0.1:8088 -t . >"$RUNNER_TEMP/meteonexa/php-server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/?preview >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/meteonexa/php-server.log"; exit 1
      - run: python3 qa/http_smoke.py http://127.0.0.1:8088/
      - name: Install Playwright browser
        working-directory: qa
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Chromium and Firefox E2E
        working-directory: qa
        env:
          METEONEXA_TEST_BASE_URL: http://127.0.0.1:8088/
        run: npm run test:e2e -- --project="${{ matrix.browser }}"
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meteonexa-playwright-${{ matrix.browser }}-report
          path: qa/playwright-report/
          if-no-files-found: ignore

  live-production-security:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: HTTPS headers and TLS live gate
        run: python3 qa/live_security_check.py https://www.meteonexa.com/
