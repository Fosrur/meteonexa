<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0d1724">
  <base href="/">
  <link rel="icon" href="assets/icons/favicon.ico?v=20.1">
  <link rel="stylesheet" href="css/maintenance.css?v=20.1">
  <title>MeteoNexa</title>
</head>
<body>
  <main class="maintenance-shell" aria-live="polite">
    <section class="maintenance-card">
      <img class="maintenance-logo" src="assets/logo-full.png" alt="MeteoNexa">
      <div class="maintenance-spinner" aria-hidden="true"></div>
      <p class="maintenance-kicker" data-i18n="maintenance.kicker"></p>
      <h1 data-i18n="maintenance.title"></h1>
      <p class="maintenance-message" data-i18n="maintenance.message"></p>
      <p class="maintenance-note" data-i18n="maintenance.note"></p>
      <button id="maintenance-retry" type="button" data-i18n="maintenance.retry"></button>
    </section>
  </main>
  <script src="js/maintenance.js" defer></script>
</body>
</html>
