<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#030914">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="MeteoNexa">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=20.1">
  <link rel="shortcut icon" type="image/x-icon" href="assets/icons/favicon.ico?v=20.1">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20.1">
  <link rel="stylesheet" href="css/maintenance.css?v=20.1.2">
  <title>MeteoNexa</title>
</head>
<body bgcolor="#030914" style="margin:0;min-height:100vh;background:#030914;color:#f3f8ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
  <div class="maintenance-ambient" aria-hidden="true">
    <span class="maintenance-orb maintenance-orb-one"></span>
    <span class="maintenance-orb maintenance-orb-two"></span>
    <span class="maintenance-orb maintenance-orb-three"></span>
  </div>
  <main class="maintenance-shell" aria-live="polite" style="min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box">
    <section class="maintenance-card" style="width:min(100%,680px);box-sizing:border-box;padding:42px;border:1px solid rgba(126,190,255,.2);border-radius:28px;background:#071a35;text-align:center">
      <header class="maintenance-brand" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:18px;margin-bottom:30px">
        <a class="maintenance-logo-link" href="/" aria-label="MeteoNexa">
          <img class="maintenance-logo" src="assets/logo-full.png?v=20.1" alt="MeteoNexa" width="2002" height="657" style="display:block;width:min(220px,52vw);height:auto;max-height:58px;object-fit:contain">
        </a>
        <span class="maintenance-status"><i aria-hidden="true"></i><span data-i18n="maintenance.kicker">RILASCIO IN CORSO</span></span>
      </header>
      <div class="maintenance-weather-loader" aria-hidden="true">
        <span class="maintenance-sun"></span>
        <span class="maintenance-cloud"></span>
        <i></i><i></i><i></i>
      </div>
      <h1 data-i18n="maintenance.title" style="margin:0;font-size:clamp(2rem,5vw,3.15rem);line-height:1.04">MeteoNexa è in manutenzione</h1>
      <p class="maintenance-message" data-i18n="maintenance.message" style="margin:18px auto 0;max-width:560px;color:#b9cbe1;line-height:1.65">Stiamo pubblicando una nuova versione. Il servizio tornerà disponibile automaticamente al termine del rilascio.</p>
      <div class="maintenance-progress" aria-hidden="true"><span></span></div>
      <p class="maintenance-note" data-i18n="maintenance.note" style="margin:0 auto 26px;max-width:530px;color:#86a1bf;line-height:1.55">Puoi lasciare questa pagina aperta e riprovare tra poco.</p>
      <button class="maintenance-button" id="maintenance-retry" type="button" style="min-height:48px;padding:0 19px;border:1px solid rgba(116,190,255,.35);border-radius:15px;background:#0c284c;color:#f3f8ff;font:inherit;font-weight:750;cursor:pointer">
        <span class="maintenance-button-icon" aria-hidden="true">↻</span>
        <span data-i18n="maintenance.retry">Riprova ora</span>
      </button>
    </section>
  </main>
  <script src="js/maintenance.js?v=20.1.2" defer></script>
</body>
</html>
