:clamp(30px,6vw,54px);border:1px solid var(--line);border-radius:30px;background:linear-gradient(150deg,rgba(11,39,78,.93),rgba(4,18,39,.94));box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(24px) saturate(135%);text-align:center}.maintenance-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.055),transparent 27%,transparent 72%,rgba(51,158,255,.05))}.maintenance-brand{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px}.maintenance-logo{display:block;width:min(220px,52vw);max-height:58px;object-fit:contain;object-position:left center}.maintenance-status{display:inline-flex;align-items:center;gap:8px;min-height:31px;padding:0 12px;border:1px solid rgba(114,190,255,.2);border-radius:999px;background:rgba(32,131,229,.09);color:#a8d2f8;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}.maintenance-status i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 6px rgba(81,216,255,.09),0 0 18px rgba(81,216,255,.65);animation:maintenance-pulse 1.6s ease-in-out infinite}.maintenance-weather-loader{position:relative;width:110px;height:72px;margin:2px auto 30px}.maintenance-sun{position:absolute;top:1px;left:30px;width:43px;height:43px;border-radius:50%;background:linear-gradient(145deg,#ffe56d,#ff9d00);box-shadow:0 0 34px rgba(255,190,30,.5);animation:maintenance-sun 2s ease-in-out infinite}.maintenance-sun:before{content:"";position:absolute;inset:-11px;border:1px dashed rgba(255,205,68,.5);border-radius:50%;animation:maintenance-spin 4s linear infinite}.maintenance-cloud{position:absolute;left:19px;bottom:10px;width:73px;height:28px;border-radius:999px;background:linear-gradient(#fff,#c8d9f1);box-shadow:0 9px 24px rgba(0,0,0,.24);animation:maintenance-cloud 1.8s ease-in-out infinite alternate}.maintenance-cloud:before,.maintenance-cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.maintenance-cloud:before{width:31px;height:31px;left:12px;top:-14px}.maintenance-cloud:after{width:38px;height:38px;right:8px;top:-20px}.maintenance-weather-loader i{position:absolute;bottom:0;width:3px;height:11px;border-radius:3px;background:#53cfff;animation:maintenance-rain 1.1s linear infinite}.maintenance-weather-loader i:nth-of-type(1){left:36px}.maintenance-weather-loader i:nth-of-type(2){left:54px;animation-delay:-.35s}.maintenance-weather-loader i:nth-of-type(3){left:72px;animation-delay:-.7s}h1{position:relative;z-index:1;margin:0;font-size:clamp(2rem,5vw,3.15rem);line-height:1.04;letter-spacing:-.045em}.maintenance-message{position:relative;z-index:1;max-width:560px;margin:18px auto 0;color:var(--text-soft);font-size:clamp(1rem,2vw,1.08rem);line-height:1.68}.maintenance-progress{position:relative;z-index:1;height:3px;margin:28px auto 22px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.075);max-width:520px}.maintenance-progress span{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,transparent,#4ecbff,#2572ff,transparent);animation:maintenance-progress 1.25s ease-in-out infinite}.maintenance-note{position:relative;z-index:1;max-width:530px;margin:0 auto 26px;color:var(--muted);font-size:.94rem;line-height:1.58}.maintenance-button{position:relative;z-index:1;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 19px;border:1px solid var(--line-strong);border-radius:15px;background:rgba(255,255,255,.055);color:var(--text);font:inherit;font-weight:750;cursor:pointer;transition:transform .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease}.maintenance-button:hover{transform:translateY(-2px);background:rgba(37,137,255,.14);border-color:rgba(75,174,255,.58);box-shadow:0 14px 34px rgba(17,117,255,.14)}.maintenance-button:focus-visible{outline:3px solid rgba(81,216,255,.55);outline-offset:3px}.maintenance-button-icon{font-size:1.18rem;line-height:1}.maintenance-button.is-checking .maintenance-button-icon{animation:maintenance-spin .8s linear infinite}@keyframes maintenance-spin{to{transform:rotate(360deg)}}@keyframes maintenance-float{to{transform:translate3d(45px,-30px,0) scale(1.14)}}@keyframes maintenance-pulse{50%{opacity:.45;transform:scale(.86)}}@keyframes maintenance-sun{50%{transform:scale(1.08)}}@keyframes maintenance-cloud{to{transform:translateX(7px)}}@keyframes maintenance-rain{0%{transform:translateY(-3px);opacity:0}40%{opacity:1}100%{transform:translateY(13px);opacity:0}}@keyframes maintenance-progress{from{transform:translateX(-120%)}to{transform:translateX(340%)}}@media(max-width:620px){.maintenance-card{border-radius:24px}.maintenance-brand{flex-direction:column;justify-content:center}.maintenance-logo{object-position:center}.maintenance-status{white-space:normal}.maintenance-message{line-height:1.58}}@media(prefers-reduced-motion:reduce){.maintenance-orb,.maintenance-status i,.maintenance-sun,.maintenance-sun:before,.maintenance-cloud,.maintenance-weather-loader i,.maintenance-progress span,.maintenance-button.is-checking .maintenance-button-icon{animation:none!important}.maintenance-button{transition:none}}</style>
